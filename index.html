<!DOCTYPE html>
<html lang="en">
<head>
<meta charset="utf-8">
<meta name="viewport" content="width=device-width, initial-scale=1, viewport-fit=cover">
<meta name="theme-color" content="#0E2620">
<title>Gringotts</title>
<link rel="manifest" href="manifest.webmanifest">
<link rel="icon" href="icon-192.png">
<link rel="apple-touch-icon" href="icon-192.png">
<link rel="preconnect" href="https://fonts.googleapis.com">
<link rel="preconnect" href="https://fonts.gstatic.com" crossorigin>
<link rel="stylesheet" href="https://fonts.googleapis.com/css2?family=Cinzel:wght@400;600;800&display=block">
<style>
  :root { --bg: #0E2620; --gold: #E2B54C; --gold-hi: #FBE3A0; --gold-lo: #9C7424; --muted: #A9A08A; --text: #ECE6D8; }
  html, body { margin: 0; height: 100%; background: var(--bg); color: var(--text); font: 16px/1.5 system-ui, sans-serif; }
  iframe { position: fixed; inset: 0; width: 100%; height: 100%; border: 0; }

  /* the vault: shared by the opening screen and the setup screen */
  .vault { display: flex; flex-direction: column; align-items: center; text-align: center; }
  .door-wrap { position: relative; }
  .door-wrap::before { content: ""; position: absolute; inset: -30%; border-radius: 50%;
    background: radial-gradient(closest-side, rgba(226,181,76,.22), rgba(226,181,76,0)); }
  .door { position: relative; display: block; width: 100%; height: 100%; }
  .word { margin: 22px 0 0; font: 800 clamp(1.7rem, 7vw, 2.4rem)/1 Cinzel, Georgia, serif; letter-spacing: .2em; padding-left: .2em;
    background: linear-gradient(180deg, var(--gold-hi), var(--gold) 55%, var(--gold-lo)); -webkit-background-clip: text; background-clip: text; color: transparent;
    filter: drop-shadow(0 1px 0 #3E2E0C) drop-shadow(0 2px 3px rgba(0,0,0,.45)); }   /* carved into stone */
  .rule { display: flex; align-items: center; gap: 10px; margin: 14px 0 0; width: min(220px, 60vw); }
  .rule::before, .rule::after { content: ""; flex: 1; height: 1px; background: linear-gradient(90deg, rgba(226,181,76,0), var(--gold)); }
  .rule::after { transform: scaleX(-1); }
  .rule i { width: 6px; height: 6px; background: var(--gold); transform: rotate(45deg); }
  .tag { margin: 12px 0 0; font: 400 .78rem Cinzel, Georgia, serif; letter-spacing: .28em; padding-left: .28em; color: var(--muted); }

  #splash { position: fixed; inset: 0; display: flex; align-items: center; justify-content: center; background: var(--bg); }
  #splash[hidden] { display: none; }
  #splash .door-wrap { width: min(46vw, 200px); height: min(46vw, 200px); }
  #splash .door svg { display: block; width: 100%; height: 100%; }
  #splash.unlock .bolts { transition: transform .45s cubic-bezier(.3,0,.2,1); transform: scale(.9); }   /* bolts pull in */
  #splash.open { animation: fade .45s ease-in .4s forwards; pointer-events: none; }
  @keyframes fade { to { opacity: 0; } }
  @media (prefers-reduced-motion: reduce) { #splash.open { animation-delay: 0s; } }

  main { max-width: 26rem; margin: 0 auto; padding: max(48px, 8vh) 16px 32px; }
  main .door-wrap { width: 112px; height: 112px; }
  form { margin-top: 36px; }
  label { display: block; margin-bottom: 6px; font-size: .9rem; color: var(--text); }
  .hint { color: var(--muted); font-size: .9rem; margin: 0 0 20px; text-align: center; }
  input { box-sizing: border-box; width: 100%; min-height: 48px; padding: 12px; border-radius: 10px; border: 1px solid #2C4A41; background: #12302A; color: inherit; font: inherit; }
  input:focus-visible, button:focus-visible { outline: 2px solid var(--gold); outline-offset: 2px; }
  button { margin-top: 12px; width: 100%; min-height: 48px; border: 0; border-radius: 10px; color: #2A1E05; cursor: pointer;
    background: linear-gradient(180deg, var(--gold-hi), var(--gold)); font: 600 .95rem Cinzel, Georgia, serif; letter-spacing: .14em; }
  .err { color: #F28B82; min-height: 1.5em; margin: 8px 0 0; font-size: .9rem; }
</style>
</head>
<body>
<!-- This page is public: it holds no link, secret or data. Each phone keeps its own app link in this browser's storage. -->
<div id="splash" hidden>
  <div class="vault">
    <div class="door-wrap">
      <div class="door"><img src="logo.svg" alt="" style="width:100%;height:100%"></div>
    </div>
    <p class="word">Gringotts</p>
    <div class="rule"><i></i></div>
    <p class="tag">Goblins at Work</p>
  </div>
</div>
<main id="setup" hidden>
  <div class="vault">
    <div class="door-wrap"><img class="door" src="logo.svg" alt=""></div>
    <h1 class="word">Gringotts</h1>
    <div class="rule"><i></i></div>
  </div>
  <form id="f">
    <p class="hint">Paste your personal app link once. It stays on this phone only. To change it later, long-press the app icon and pick Change link.</p>
    <label for="link">App link</label>
    <input id="link" type="url" inputmode="url" autocomplete="off" placeholder="https://script.google.com/…" required>
    <p class="err" id="err" role="alert"></p>
    <button type="submit">Open the vault</button>
  </form>
</main>
<script>
  var KEY = 'expenseAppLink';
  function saved() { try { return localStorage.getItem(KEY) || ''; } catch (e) { return ''; } }
  if ('serviceWorker' in navigator) navigator.serviceWorker.register('sw.js').catch(function () {});
  var link = saved();
  var demo = /[?&]demo\b/.test(location.search);   // ?demo: plays the opening with a pretend 2.5 s load, no app
  if ((link || demo) && !/[?&]change\b/.test(location.search)) {
    var sp = document.getElementById('splash'), shown = Date.now(), door = sp.querySelector('.door'), wheel = null;
    sp.hidden = false;   // the wheel turns back and forth like a combination lock while the app loads
    // Put the door drawing into the page itself, so the wheel and bolts can be moved from here.
    fetch('logo.svg').then(function (r) { return r.text(); }).then(function (t) {
      door.innerHTML = t; wheel = door.querySelector('.wheel');
    }).catch(function () {});
    var opened = false, open = function () {
      if (opened) return; opened = true;
      var still = matchMedia('(prefers-reduced-motion: reduce)').matches;
      sp.classList.add('unlock');   // the wheel stops where it is, the bolts pull in, then the app fades in
      if (wheel) wheel.style.animationPlayState = 'paused';
      sp.classList.add('open');
      setTimeout(function () { sp.remove(); }, still ? 500 : 900);
    };
    var ready = function () { setTimeout(open, Math.max(0, 3200 - (Date.now() - shown))); };   // at least a right and a left turn first
    sp.addEventListener('click', open);   // tap to skip
    if (demo) setTimeout(ready, 2500);
    else {
      var fr = document.createElement('iframe');
      fr.src = link; fr.title = 'Gringotts';
      fr.allow = 'clipboard-read; clipboard-write';
      fr.addEventListener('load', ready);
      document.body.insertBefore(fr, sp);
    }
  } else {
    document.getElementById('setup').hidden = false;
    var inp = document.getElementById('link');
    inp.value = link;
    inp.addEventListener('input', function () { document.getElementById('err').textContent = ''; });
    document.getElementById('f').addEventListener('submit', function (e) {
      e.preventDefault();
      var v = inp.value.trim();
      if (!/^https:\/\/[^\s]+$/.test(v)) { document.getElementById('err').textContent = 'The link must start with https://'; return; }
      try { localStorage.setItem(KEY, v); } catch (err) { document.getElementById('err').textContent = 'This browser would not save the link.'; return; }
      location.replace(location.pathname);
    });
  }
</script>
</body>
</html>
