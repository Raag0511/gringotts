<!DOCTYPE html>
<html lang="en">
<head>
<meta charset="utf-8">
<meta name="viewport" content="width=device-width, initial-scale=1, viewport-fit=cover">
<meta name="theme-color" content="#0E2620">
<title>Gringotts</title>
<link rel="manifest" href="manifest.webmanifest">
<link rel="icon" href="icon-192.png">
<link rel="apple-touch-icon" href="icon-192.png">
<link rel="preconnect" href="https://fonts.googleapis.com">
<link rel="preconnect" href="https://fonts.gstatic.com" crossorigin>
<link rel="stylesheet" href="https://fonts.googleapis.com/css2?family=Cinzel:wght@400;600;800&display=block">
<style>
  :root { --bg: #0E2620; --gold: #E2B54C; --gold-hi: #FBE3A0; --gold-lo: #9C7424; --muted: #A9A08A; --text: #ECE6D8; }
  html, body { margin: 0; height: 100%; background: var(--bg); color: var(--text); font: 16px/1.5 system-ui, sans-serif; }
  iframe { position: fixed; inset: 0; width: 100%; height: 100%; border: 0; }

  /* the vault: shared by the opening screen and the setup screen */
  .vault { display: flex; flex-direction: column; align-items: center; text-align: center; }
  .door-wrap { position: relative; perspective: 700px; }
  .door-wrap::before { content: ""; position: absolute; inset: -30%; border-radius: 50%;
    background: radial-gradient(closest-side, rgba(226,181,76,.22), rgba(226,181,76,0)); }
  .door { position: relative; display: block; width: 100%; height: 100%; z-index: 2; transform-origin: 14.5% 50%; }   /* hinges on the left */
  .word { margin: 22px 0 0; font: 800 clamp(1.7rem, 7vw, 2.4rem)/1 Cinzel, Georgia, serif; letter-spacing: .2em; padding-left: .2em;
    background: linear-gradient(180deg, var(--gold-hi), var(--gold) 55%, var(--gold-lo)); -webkit-background-clip: text; background-clip: text; color: transparent;
    filter: drop-shadow(0 1px 0 #3E2E0C) drop-shadow(0 2px 3px rgba(0,0,0,.45)); }   /* carved into stone */
  .rule { display: flex; align-items: center; gap: 10px; margin: 14px 0 0; width: min(220px, 60vw); }
  .rule::before, .rule::after { content: ""; flex: 1; height: 1px; background: linear-gradient(90deg, rgba(226,181,76,0), var(--gold)); }
  .rule::after { transform: scaleX(-1); }
  .rule i { width: 6px; height: 6px; background: var(--gold); transform: rotate(45deg); }
  .tag { margin: 12px 0 0; font: 400 .78rem Cinzel, Georgia, serif; letter-spacing: .28em; padding-left: .28em; color: var(--muted); }

  /* ---- the opening ---- */
  #splash { position: fixed; inset: 0; background: radial-gradient(90% 55% at 50% 42%, #173a31 0%, var(--bg) 62%); cursor: pointer; outline: none; z-index: 5; }
  #splash[hidden] { display: none; }
  .front { position: absolute; inset: 0; display: flex; align-items: center; justify-content: center; transition: opacity .5s; }
  #splash .door-wrap { width: min(56vw, 240px); height: min(56vw, 240px); }   /* the mockup's size */
  #splash .door-wrap::before { animation: breathe 2.6s ease-in-out infinite; }
  @keyframes breathe { 50% { opacity: .55; transform: scale(.94); } }
  #splash .door svg, #splash .door img { display: block; width: 100%; height: 100%; }
  .wheel, .bolts { transform-origin: 50px 50px; }
  .glow { position: absolute; inset: 6%; border-radius: 50%; opacity: 0; transform: scale(.6);
    background: radial-gradient(circle, #fff6d6 0%, var(--gold-hi) 30%, rgba(226,181,76,0) 70%); }
  /* the goblin in the doorway: spectacles pushed up, a blink, a small formal bow */
  .popgob { position: absolute; left: 12%; top: 8%; width: 76%; z-index: 1; opacity: 0; transform: translateY(34%) scale(.6);
    transition: transform .5s cubic-bezier(.3,1.5,.5,1), opacity .2s; }
  .popgob .headg, .popgob .arm, .popgob .lids, .popgob .bodyg { transform-box: fill-box; }
  .popgob .headg { transform-origin: 50% 100%; }
  .popgob .lids { transform-origin: 50% 0; transform: scaleY(0); }
  .popgob .arm { transform: translate(0, 32px); }
  #splash.unlock .wheel { animation-play-state: paused; }
  #splash.unlock .bolts { transition: transform .4s cubic-bezier(.3,0,.2,1); transform: scale(.9); }   /* bolts pull in */
  #splash.swing .door { transition: transform .55s cubic-bezier(.55,0,.25,1); transform: rotateY(-104deg); }   /* the door swings back */
  #splash.swing .glow { transition: opacity .25s, transform .6s ease-out; opacity: 1; transform: scale(1.9); }
  #splash.deep .glow { transition: opacity .25s, transform .9s ease-in; transform: scale(6); }
  #splash.pop .popgob { opacity: 1; transform: none; }
  #splash.pop .popgob .arm { animation: specs 1s ease-in-out .3s both; }
  #splash.pop .popgob .glint { animation: glint .45s ease .72s 1; }
  #splash.pop .popgob .lids { animation: lid .22s ease 1.05s 1; }
  #splash.pop .popgob .headg { animation: bow .7s ease-in-out 1.25s both; }
  #splash.pop .popgob .bodyg { animation: bowb .7s ease-in-out 1.25s both; }
  @keyframes specs { 0% { transform: translate(0,32px); } 38%, 56% { transform: translate(-7.5px,-7.5px); } 100% { transform: translate(0,32px); } }
  @keyframes glint { 0%, 100% { opacity: 0; } 50% { opacity: 1; } }
  @keyframes lid { 50% { transform: scaleY(1); } }
  @keyframes bow { 45% { transform: translateY(5px) scaleY(.93) rotate(-2deg); } }
  @keyframes bowb { 45% { transform: translateY(2px); } }

  /* the vault room: first or slow load */
  .vroom { position: absolute; inset: 0; display: flex; flex-direction: column; align-items: center; justify-content: center; gap: 4px; opacity: 0; transition: opacity .6s; pointer-events: none; }
  .vroom .mini { font: 800 clamp(1.1rem, 5vw, 1.4rem)/1 Cinzel, Georgia, serif; letter-spacing: .22em; padding-left: .22em; color: var(--gold); }
  .vroom .rule { margin: 8px 0 0; width: min(170px, 46vw); }
  .vroom .mtag { font: 400 .68rem Cinzel, Georgia, serif; letter-spacing: .28em; padding-left: .28em; color: var(--muted); margin: 8px 0 6px; }
  .vroom svg { width: min(92vw, 380px); overflow: visible; }
  .vroom .quill { transform-box: fill-box; transform-origin: 10% 90%; animation: scribble .3s ease-in-out infinite alternate; }
  .vroom .head { transform-box: fill-box; transform-origin: 50% 90%; animation: nod 3.2s ease-in-out infinite; }
  .vroom .rglint { animation: glint 3s ease 1s infinite; }
  .vroom .ink { stroke-dasharray: 40; stroke-dashoffset: 40; animation: ink 2.4s linear infinite; }
  .vroom .ink:nth-of-type(2) { animation-delay: .8s; } .vroom .ink:nth-of-type(3) { animation-delay: 1.6s; }
  .vroom .stampg { transform-box: fill-box; transform-origin: center; transform: scale(2.4) rotate(-10deg); opacity: 0; transition: transform .28s cubic-bezier(.5,1.6,.6,1), opacity .12s; }
  @keyframes scribble { from { transform: rotate(-7deg); } to { transform: rotate(6deg) translateX(2px); } }
  @keyframes nod { 0%, 60%, 100% { transform: none; } 70% { transform: rotate(-5deg); } 85% { transform: rotate(3deg); } }
  @keyframes ink { 0% { stroke-dashoffset: 40; } 40%, 100% { stroke-dashoffset: 0; } }
  #splash.room .front { opacity: 0; }
  #splash.room .vroom { opacity: 1; }
  #splash.stamp .stampg { opacity: 1; transform: scale(1) rotate(-10deg); }
  #splash.stamp .quill, #splash.stamp .ink { animation-play-state: paused; }
  .status { position: absolute; left: 0; right: 0; bottom: max(8.5%, 40px); text-align: center; font: 500 .72rem ui-monospace, Consolas, monospace; color: var(--muted); opacity: 0; transition: opacity .3s; padding: 0 20px; }
  .status.on { opacity: 1; }
  .skip { position: absolute; right: 16px; bottom: max(16px, env(safe-area-inset-bottom)); font: 500 .7rem ui-monospace, Consolas, monospace; letter-spacing: .08em; color: rgba(169,160,138,.55); }
  #splash.open { transition: opacity .35s ease-in; opacity: 0; pointer-events: none; }
  @media (prefers-reduced-motion: reduce) {
    .wheel, .vroom *, .popgob, .popgob * { animation: none !important; }
    #splash .door, #splash .glow, .popgob, .front, .vroom, #splash.open { transition: none !important; }
  }

  main { max-width: 26rem; margin: 0 auto; padding: max(48px, 8vh) 16px 32px; }
  main .door-wrap { width: 112px; height: 112px; }
  form { margin-top: 36px; }
  label { display: block; margin-bottom: 6px; font-size: .9rem; color: var(--text); }
  .hint { color: var(--muted); font-size: .9rem; margin: 0 0 20px; text-align: center; }
  input { box-sizing: border-box; width: 100%; min-height: 48px; padding: 12px; border-radius: 10px; border: 1px solid #2C4A41; background: #12302A; color: inherit; font: inherit; }
  input:focus-visible, button:focus-visible, #splash:focus-visible { outline: 2px solid var(--gold); outline-offset: 2px; }
  button { margin-top: 12px; width: 100%; min-height: 48px; border: 0; border-radius: 10px; color: #2A1E05; cursor: pointer;
    background: linear-gradient(180deg, var(--gold-hi), var(--gold)); font: 600 .95rem Cinzel, Georgia, serif; letter-spacing: .14em; }
  .err { color: #F28B82; min-height: 1.5em; margin: 8px 0 0; font-size: .9rem; }
</style>
</head>
<body>
<!-- This page is public: it holds no link, secret or data. Each phone keeps its own app link in this browser's storage. -->

            <ellipse cx="65" cy="72" rx="4.2" ry="3.5" fill="#5d7f59"/>
            <path d="M63.5 70 L58.5 61.5" stroke="#5d7f59" stroke-width="2.2" stroke-linecap="round"/>
            <path d="M66.5 69.5 L64 64" stroke="#4f6f4c" stroke-width="2" stroke-linecap="round"/>
          </g>
        </svg>
        <div class="door"><img src="logo.svg" alt=""></div>
      </div>
      <p class="word">Gringotts</p>
      <div class="rule"><i></i></div>
      <p class="tag">Goblins at Work</p>
    </div>
  </div>

  <!-- the vault room: a goblin writing in his ledger while coins land on his stacks (original drawing) -->
  <div class="vroom" aria-hidden="true">
    <div class="mini">Gringotts</div>
    <div class="rule"><i></i></div>
    <div class="mtag">Goblins at Work</div>
    <svg viewBox="0 0 300 300">
      <defs><radialGradient id="rg" cx="50%" cy="55%" r="55%"><stop offset="0" stop-color="#f1d68a" stop-opacity=".45"/><stop offset="1" stop-color="#f1d68a" stop-opacity="0"/></radialGradient></defs>
      <path d="M28 300 V110 Q28 22 150 22 Q272 22 272 110 V300 Z" fill="#12302A" stroke="#9C7424" stroke-width="2"/>

      <g fill="#E2B54C" stroke="#7a5a1c" stroke-width=".8">
        <rect x="58" y="78" width="14" height="4" rx="2"/><rect x="58" y="74" width="14" height="4" rx="2"/><rect x="59" y="70" width="14" height="4" rx="2"/>
        <rect x="78" y="78" width="14" height="4" rx="2"/><rect x="78" y="74" width="14" height="4" rx="2"/>
        <rect x="206" y="78" width="14" height="4" rx="2"/><rect x="207" y="74" width="14" height="4" rx="2"/><rect x="206" y="70" width="14" height="4" rx="2"/><rect x="206" y="66" width="14" height="4" rx="2"/>
        <rect x="228" y="78" width="14" height="4" rx="2"/>
        <rect x="62" y="124" width="14" height="4" rx="2"/><rect x="224" y="124" width="14" height="4" rx="2"/><rect x="224" y="120" width="14" height="4" rx="2"/>
      </g>
      <g fill="#5a3f1a"><rect x="100" y="112" width="26" height="22" rx="2"/><rect x="176" y="116" width="22" height="18" rx="2"/></g>
      <g fill="#E2B54C"><rect x="111" y="120" width="4" height="5"/><rect x="185" y="122" width="4" height="5"/></g>
      <g transform="translate(50 128)">
        <path d="M62 62 L14 38 L58 80 Z" fill="#4c6b4a"/><path d="M138 62 L186 38 L142 80 Z" fill="#4c6b4a"/>
        <path d="M58 118 Q100 92 142 118 L148 140 L52 140 Z" fill="#1f2a24"/>

        <g class="head">
          <ellipse cx="100" cy="70" rx="40" ry="38" fill="#5d7f59"/>

          <path d="M74 56 L92 60 M126 56 L108 60" stroke="#22301f" stroke-width="3" stroke-linecap="round"/>

          <circle cx="115" cy="68" r="9" fill="#fbe3a0" fill-opacity=".18" stroke="#E2B54C" stroke-width="2"/>
          <path d="M94 68 L106 68" stroke="#E2B54C" stroke-width="2"/>

        <path d="M62 131 h28 M62 134.5 h22 M62 138 h26" stroke="#9c8c6a" stroke-width="1"/>

          <rect x="24" y="128" width="18" height="4" rx="2"/><rect x="24" y="124" width="18" height="4" rx="2"/><rect x="25" y="120" width="18" height="4" rx="2"/><rect x="24" y="116" width="18" height="4" rx="2"/>

  <p class="status" id="status" aria-live="polite"></p>

</div>
<main id="setup" hidden>
  <div class="vault">
    <div class="door-wrap"><img class="door" src="logo.svg" alt=""></div>
    <h1 class="word">Gringotts</h1>
    <div class="rule"><i></i></div>
  </div>
  <form id="f">
    <p class="hint">Paste your personal app link once. It stays on this phone only. To change it later, long-press the app icon and pick Change link.</p>
    <label for="link">App link</label>
    <input id="link" type="url" inputmode="url" autocomplete="off" placeholder="https://script.google.com/…" required>
    <p class="err" id="err" role="alert"></p>
    <button type="submit">Open the vault</button>
  </form>
</main>
<script>
  var KEY = 'expenseAppLink';
  function saved() { try { return localStorage.getItem(KEY) || ''; } catch (e) { return ''; } }
  // The screen a link asks for (e.g. ?tab=cards from the 8 am email). Only these values are passed on to the app.
  function asked() {
    var q = new URLSearchParams(location.search), out = new URLSearchParams(), t = (q.get('tab') || '').toLowerCase();
    if (/^(home|activity|tag|insights|cards|friends|cash|books|teach)$/.test(t)) out.set('tab', t);
    // 'card' opens a card (7.26). Older emails said 'c', which Google keeps for itself and refuses: sent on as 'card'.
    [['row', 'row'], ['card', 'card'], ['c', 'card']].forEach(function (k) { var v = q.get(k[0]) || ''; if (/^\d{1,6}$/.test(v)) out.set(k[1], v); });
    return out;
  }
  // The saved app link with the asked-for screen added; replaces any screen already in it, keeps everything else.
  function withScreen(link, q) {
    try { var u = new URL(link); q.forEach(function (v, k) { u.searchParams.set(k, v); }); return u.href; } catch (e) { return link; }
  }
  if ('serviceWorker' in navigator) navigator.serviceWorker.register('sw.js').catch(function () {});
  var link = saved();
  // ?demo plays the opening with a pretend load and no app: ?demo (2.5 s), ?demo=700 (fast), ?demo=5000 (vault room)
  var demoM = location.search.match(/[?&]demo(?:=(\d{1,5}))?\b/), demo = !!demoM;
  if ((link || demo) && !/[?&]change\b/.test(location.search)) {
    var sp = document.getElementById('splash'), st = document.getElementById('status'), coinG = document.getElementById('coins'), door = sp.querySelector('.door');
    var still = matchMedia('(prefers-reduced-motion: reduce)').matches;
    var MIN = 1500, CAP = 7000, ROOM_MIN = 1400, GAP = 1600;   // wheel turns at least 1.5 s; never past 7 s; at least 1.4 s in the room
    var LINES = ['Counting the coins…', 'Balancing the ledgers…', 'Debits to the left, credits to the right…', 'Casting the trial balance…', 'Stamping the vouchers…',
      'Carrying the balances forward…', 'Polishing the scales…', 'Checking the vault locks…', 'Sharpening the quills…', 'Ticking and bashing the columns…'];
    var shown = Date.now(), timers = [], isReady = false, inRoom = false, roomAt = 0, done = false, k = -1, coinT = 0;
    var later = function (f, ms) { timers.push(setTimeout(f, ms)); };
    var add = function (c) { sp.classList.add(c); };
    window.gringottsOpening = [];   // what happened, in order (read by the tests)
    var mark = function (s) { gringottsOpening.push(s); };
    sp.hidden = false;
    // The door drawing goes into the page itself, so the wheel and bolts can be moved from here.
    fetch('logo.svg').then(function (r) { return r.text(); }).then(function (t) { if (!done) door.innerHTML = t; }).catch(function () {});
    var finish = function (why) {
      if (done) return; done = true; mark('open:' + why);
      timers.forEach(clearTimeout); clearTimeout(coinT); clearTimeout(rot);
      add('open'); setTimeout(function () { sp.remove(); }, still ? 0 : 400);
    };
    var rot = 0, next = function (gap) { k = (k + 1) % LINES.length; st.textContent = LINES[k]; st.classList.add('on'); clearTimeout(rot); rot = setTimeout(function () { if (!done) next(gap); }, gap); };
    later(function () { next(1100); }, 600);   // status lines from 0.6 s on both paths, as in the mockup
    var coins = function () {   // bursts of 5–6 onto one stack, then 5–6 onto the other
      if (still || !coinG.animate) return;
      var side = Math.random() < .5 ? 0 : 1, left = 5 + Math.round(Math.random());
      (function drop() {
        if (done || sp.classList.contains('stamp')) return;
        var e = document.createElementNS('http://www.w3.org/2000/svg', 'ellipse');
        e.setAttribute('cx', (side ? 168 : 33) + (Math.random() * 6 - 3)); e.setAttribute('cy', side ? 122 : 113); e.setAttribute('rx', 9); e.setAttribute('ry', 2.6);
        coinG.appendChild(e);
        e.animate([{ transform: 'translateY(-125px)', opacity: 1 }, { transform: 'translateY(0)', opacity: 1, offset: .85 }, { transform: 'translateY(0)', opacity: 0 }],
          { duration: 900, easing: 'cubic-bezier(.5,0,.9,.6)' }).onfinish = function () { e.remove(); };
        if (--left <= 0) { side = 1 - side; left = 5 + Math.round(Math.random()); coinT = setTimeout(drop, 450 + Math.random() * 250); }
        else coinT = setTimeout(drop, 170 + Math.random() * 130);
      })();
    };
    // Fast: bolts in, the door swings back on its hinges with gold light, the goblin rises, pushes up his spectacles, blinks, bows.
    var fast = function () {
      if (done) return; mark('fast');
      add('unlock'); later(function () { add('swing'); }, still ? 0 : 300);
      later(function () { add('pop'); }, still ? 0 : 420);
      later(function () { finish('ready'); }, still ? 300 : 2050);
    };
    // Slow: deeper into the vault room; the goblin writes, coins drop, generic status lines (nothing personal).
    var room = function () {
      if (done || isReady) return; inRoom = true; mark('room');
      add('unlock'); later(function () { add('swing'); add('deep'); }, still ? 0 : 300);
      roomAt = Date.now() + (still ? 0 : 750);
      later(function () { add('room'); k = -1; next(GAP); coins(); }, still ? 0 : 750);
    };
    var ready = function (why) {
      if (isReady || done) return; isReady = true; mark('ready:' + why);
      if (!inRoom) { later(fast, Math.max(0, MIN - (Date.now() - shown))); return; }
      later(function () {   // he stamps ENTERED, the room fades into Home
        if (done) return; add('stamp'); clearTimeout(rot); st.textContent = 'Entered. Opening the vault…';
        later(function () { finish(why); }, still ? 200 : 800);
      }, Math.max(0, roomAt + ROOM_MIN - Date.now()));
    };
    later(room, MIN);                                       // not ready at 1.5 s: into the vault room
    later(function () { if (!done) { isReady = false; inRoom = true; if (!roomAt) roomAt = Date.now() - ROOM_MIN; ready('7 s limit'); } }, CAP);
    sp.addEventListener('click', function () { finish('tapped'); });   // tap to skip, at any point
    sp.addEventListener('keydown', function (e) { if (e.key === 'Enter' || e.key === ' ') { e.preventDefault(); finish('tapped'); } });
    if (demo) later(function () { ready('demo'); }, demoM[1] ? Number(demoM[1]) : 2500);
    else {
      // The app says it is ready once Home has drawn its figures. Only a message of that type from Google's app pages counts.
      addEventListener('message', function (e) {
        if (/^https:\/\/([a-z0-9-]+\.)*googleusercontent\.com$/.test(e.origin) && e.data && e.data.type === 'gringotts-ready') ready('message');
      });
      var fr = document.createElement('iframe');
      fr.src = withScreen(link, asked()); fr.title = 'Gringotts';
      fr.allow = 'clipboard-read; clipboard-write';
      fr.addEventListener('load', function () { later(function () { ready('frame loaded'); }, 2500); });   // fallback: an app without the message
      document.body.insertBefore(fr, sp);
    }
  } else {
    document.getElementById('setup').hidden = false;
    var inp = document.getElementById('link');
    inp.value = link;
    inp.addEventListener('input', function () { document.getElementById('err').textContent = ''; });
    document.getElementById('f').addEventListener('submit', function (e) {
      e.preventDefault();
      var v = inp.value.trim();
      if (!/^https:\/\/[^\s]+$/.test(v)) { document.getElementById('err').textContent = 'The link must start with https://'; return; }
      try { localStorage.setItem(KEY, v); } catch (err) { document.getElementById('err').textContent = 'This browser would not save the link.'; return; }
      var q = asked().toString();   // keep the screen the first link asked for
      location.replace(location.pathname + (q ? '?' + q : ''));
    });
  }
</script>
