<svg xmlns="http://www.w3.org/2000/svg" viewBox="0 0 100 100" role="img" aria-label="Gringotts">
  <!-- Gringotts vault door (original drawing). Everything sits within 38 of the centre so Android's icon masks never cut it. -->
  <defs>
    <radialGradient id="steel" cx="42%" cy="38%" r="70%">
      <stop offset="0" stop-color="#2B313B"/><stop offset="1" stop-color="#14181E"/>
    </radialGradient>
    <linearGradient id="gold" x1="0" y1="0" x2="1" y2="1">
      <stop offset="0" stop-color="#F3D27A"/><stop offset=".5" stop-color="#D4A537"/><stop offset="1" stop-color="#9C7424"/>
    </linearGradient>
    <style>
      .wheel { transform-origin: 50px 50px; }
      @media (prefers-reduced-motion: no-preference) { .wheel { animation: turn 2.4s cubic-bezier(.45,0,.25,1) infinite; } }
      @keyframes turn { to { transform: rotate(360deg); } }
    </style>
  </defs>
  <rect width="100" height="100" fill="#0E1116"/>
  <!-- hinges -->
  <rect x="12.5" y="38" width="5" height="8" rx="1.5" fill="url(#gold)"/>
  <rect x="12.5" y="54" width="5" height="8" rx="1.5" fill="url(#gold)"/>
  <!-- frame and door -->
  <circle cx="50" cy="50" r="37" fill="url(#gold)"/>
  <circle cx="50" cy="50" r="33.5" fill="url(#steel)"/>
  <circle cx="50" cy="50" r="33.5" fill="none" stroke="#6E5419" stroke-width="1"/>
  <!-- locking bolts -->
  <g fill="url(#gold)">
    <circle cx="50" cy="20" r="1.8"/><circle cx="65" cy="24" r="1.8"/><circle cx="76" cy="35" r="1.8"/>
    <circle cx="80" cy="50" r="1.8"/><circle cx="76" cy="65" r="1.8"/><circle cx="65" cy="76" r="1.8"/>
    <circle cx="50" cy="80" r="1.8"/><circle cx="35" cy="76" r="1.8"/><circle cx="24" cy="65" r="1.8"/>
    <circle cx="20" cy="50" r="1.8"/><circle cx="24" cy="35" r="1.8"/><circle cx="35" cy="24" r="1.8"/>
  </g>
  <circle cx="50" cy="50" r="25" fill="none" stroke="#D4A537" stroke-opacity=".45" stroke-width=".8"/>
  <!-- wheel (spins on the loading screen; still in the icons) -->
  <g class="wheel">
    <g stroke="#D4A537" stroke-width="2.6" stroke-linecap="round">
      <line x1="50" y1="30" x2="50" y2="70"/>
      <line x1="32.7" y1="40" x2="67.3" y2="60"/>
      <line x1="32.7" y1="60" x2="67.3" y2="40"/>
    </g>
    <circle cx="50" cy="50" r="15" fill="none" stroke="url(#gold)" stroke-width="2.4"/>
    <g fill="url(#gold)">
      <circle cx="50" cy="30" r="2.8"/><circle cx="67.3" cy="40" r="2.8"/><circle cx="67.3" cy="60" r="2.8"/>
      <circle cx="50" cy="70" r="2.8"/><circle cx="32.7" cy="60" r="2.8"/><circle cx="32.7" cy="40" r="2.8"/>
    </g>
    <circle cx="50" cy="50" r="6.5" fill="url(#gold)"/>
    <circle cx="50" cy="50" r="3.6" fill="#14181E"/>
    <path d="M50 47.6a1.2 1.2 0 0 1 1.2 1.2c0 .5-.3.9-.6 1.1l.6 2.6h-2.4l.6-2.6c-.4-.2-.6-.6-.6-1.1a1.2 1.2 0 0 1 1.2-1.2z" fill="#D4A537"/>
  </g>
</svg>
