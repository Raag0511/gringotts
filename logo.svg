<svg xmlns="http://www.w3.org/2000/svg" xmlns:xlink="http://www.w3.org/1999/xlink" viewBox="0 0 100 100" role="img" aria-label="Gringotts">
  <!-- Gringotts vault door (original drawing). Transparent background; the icons add the dark square.
       Everything sits within 39 of the centre so Android's icon masks never cut it. -->
  <defs>
    <linearGradient id="gold" x1="0" y1="0" x2="1" y2="1">
      <stop offset="0" stop-color="#FBE3A0"/><stop offset=".35" stop-color="#E2B54C"/>
      <stop offset=".7" stop-color="#B8892E"/><stop offset="1" stop-color="#7A5A1C"/>
    </linearGradient>
    <linearGradient id="goldIn" x1="1" y1="1" x2="0" y2="0">
      <stop offset="0" stop-color="#F6D78A"/><stop offset=".5" stop-color="#C99A38"/><stop offset="1" stop-color="#6E5019"/>
    </linearGradient>
    <radialGradient id="steel" cx="38%" cy="32%" r="78%">
      <stop offset="0" stop-color="#36443F"/><stop offset=".55" stop-color="#1F2A26"/><stop offset="1" stop-color="#0F1714"/>
    </radialGradient>
    <radialGradient id="plate" cx="40%" cy="35%" r="75%">
      <stop offset="0" stop-color="#2B3833"/><stop offset="1" stop-color="#121A17"/>
    </radialGradient>
    <g id="spoke">
      <rect x="48.7" y="31.5" width="2.6" height="37" rx="1.3" fill="url(#gold)"/>
      <circle cx="50" cy="31" r="2.7" fill="url(#gold)"/>
      <circle cx="50" cy="69" r="2.7" fill="url(#gold)"/>
      <circle cx="49.3" cy="30.3" r=".9" fill="#FFF3CF" opacity=".7"/>
      <circle cx="49.3" cy="68.3" r=".9" fill="#FFF3CF" opacity=".7"/>
    </g>
    <style>
      .wheel, .bolts { transform-origin: 50px 50px; }
      @media (prefers-reduced-motion: no-preference) { .wheel { animation: combo 2.6s ease-in-out infinite; } }
      @keyframes combo { 30% { transform: rotate(220deg); } 55% { transform: rotate(40deg); } 78% { transform: rotate(160deg); } 100% { transform: rotate(0deg); } }   /* right, left, right, left */
    </style>
  </defs>

  <!-- hinges -->
  <g fill="url(#gold)">
    <rect x="11.5" y="36" width="6" height="10" rx="2"/>
    <rect x="11.5" y="54" width="6" height="10" rx="2"/>
  </g>
  <g stroke="#5C4415" stroke-width=".5">
    <line x1="11.5" y1="41" x2="17.5" y2="41"/><line x1="11.5" y1="59" x2="17.5" y2="59"/>
  </g>

  <!-- frame: bevel out, bevel in, rivets, light edge -->
  <circle cx="50" cy="50" r="38" fill="url(#gold)"/>
  <circle cx="50" cy="50" r="35.6" fill="url(#goldIn)"/>
  <circle cx="50" cy="50" r="36.8" fill="none" stroke="#5C4415" stroke-width=".9" stroke-linecap="round" stroke-dasharray="0 7.226"/>
  <circle cx="50" cy="50" r="38" fill="none" stroke="#FFF3CF" stroke-opacity=".35" stroke-width=".5" stroke-dasharray="40 200" transform="rotate(195 50 50)"/>

  <!-- door face -->
  <circle cx="50" cy="50" r="33.6" fill="url(#steel)"/>
  <circle cx="50" cy="50" r="33.6" fill="none" stroke="#0A0C0F" stroke-width="1"/>
  <circle cx="50" cy="50" r="31" fill="none" stroke="#000" stroke-opacity=".35" stroke-width=".6"/>
  <circle cx="50" cy="50" r="30.4" fill="none" stroke="#fff" stroke-opacity=".07" stroke-width=".6"/>
  <!-- locking bolts -->
  <circle class="bolts" cx="50" cy="50" r="27.4" fill="none" stroke="#3E2E0C" stroke-width="4" stroke-linecap="round" stroke-dasharray="0 14.346"/>
  <circle class="bolts" cx="50" cy="50" r="27.4" fill="none" stroke="url(#gold)" stroke-width="3" stroke-linecap="round" stroke-dasharray="0 14.346"/>

  <!-- combination plate and dial ticks -->
  <circle cx="50" cy="50" r="22" fill="url(#plate)" stroke="url(#gold)" stroke-width=".9"/>
  <circle cx="50" cy="50" r="20.2" fill="none" stroke="#D8AE4C" stroke-opacity=".75" stroke-width="1.6" stroke-dasharray=".35 2.8"/>

  <!-- wheel (turns back and forth on the opening screen; still in the icons) -->
  <g class="wheel">
    <use xlink:href="#spoke" href="#spoke"/>
    <use xlink:href="#spoke" href="#spoke" transform="rotate(60 50 50)"/>
    <use xlink:href="#spoke" href="#spoke" transform="rotate(120 50 50)"/>
    <circle cx="50" cy="50" r="14" fill="none" stroke="url(#gold)" stroke-width="2.3"/>
    <circle cx="50" cy="50" r="12.7" fill="none" stroke="#000" stroke-opacity=".35" stroke-width=".5"/>
    <circle cx="50" cy="50" r="6.4" fill="url(#gold)"/>
    <circle cx="50" cy="50" r="4.3" fill="url(#plate)" stroke="#5C4415" stroke-width=".4"/>
    <path d="M50 47.4a1.25 1.25 0 0 1 1.25 1.25c0 .45-.25.85-.6 1.05l.55 2.7h-2.4l.55-2.7a1.25 1.25 0 0 1-.6-1.05A1.25 1.25 0 0 1 50 47.4z" fill="#F0CF6E"/>
  </g>
</svg>
